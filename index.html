<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f7fb">
  <title>商品報價單</title>
  <style>
    :root{--ink:#17243a;--muted:#718096;--line:#e5eaf1;--brand:#2457d6;--brand-dark:#1946b5;--bg:#f5f7fb;--white:#fff;--danger:#c0392b;--green:#13835b}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;padding-bottom:104px}
    .wrap{width:min(1080px,calc(100% - 32px));margin:32px auto}
    header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
    h1{font-size:clamp(25px,4vw,34px);margin:0 0 7px;letter-spacing:.02em}
    .sub{color:var(--muted);font-size:14px}
    .status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap}
    .dot{width:8px;height:8px;border-radius:50%;background:#e0a02b}
    .dot.ok{background:#1da477}.dot.bad{background:#d64b43}
    .panel{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 8px 28px rgba(25,45,80,.045);margin-bottom:18px}
    .panel-title{font-weight:750;font-size:17px;margin:0 0 18px}
    .customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
    label{display:block;font-size:13px;font-weight:650;color:#526078;margin-bottom:7px}
    input,select{width:100%;height:44px;border:1px solid #dce3ed;border-radius:10px;background:#fff;padding:0 12px;font:inherit;color:var(--ink);outline:none;min-width:0}
    input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(36,87,214,.1)}
    .items-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
    .items-head .panel-title{margin:0}
    .table-wrap{overflow-x:auto}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th{text-align:left;font-size:12px;color:#718096;font-weight:700;background:#f7f9fc;padding:12px 10px}
    td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
    td .small-input{height:40px}
    .product-name{font-weight:650}.muted{color:var(--muted);font-size:13px}
    .amount{font-weight:700;white-space:nowrap}
    .remove{border:0;background:#fff1f0;color:var(--danger);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:18px}
    button{font:inherit;cursor:pointer;border:0;border-radius:11px;font-weight:700;transition:.15s}
    button:disabled{opacity:.42;cursor:not-allowed}
    .btn{padding:11px 16px;min-height:42px}
    .btn-primary{background:var(--brand);color:#fff}.btn-primary:not(:disabled):hover{background:var(--brand-dark)}
    .btn-light{background:#edf2ff;color:var(--brand)}
    .btn-outline{background:#fff;color:var(--ink);border:1px solid var(--line)}
    .add-row{display:flex;justify-content:flex-start;margin-top:16px}
    .empty{padding:28px 12px;text-align:center;color:var(--muted);font-size:14px}
    .error{display:none;background:#fff2f1;border:1px solid #f1c7c3;color:#a83229;padding:14px 16px;border-radius:12px;margin-bottom:18px;font-size:14px;line-height:1.6}
    .error.show{display:block}
    .loading{background:#fff9e9;border:1px solid #f1dfae;color:#85620e;padding:12px 14px;border-radius:12px;margin-bottom:18px;font-size:14px}
    .mobile-items{display:none}
    .item-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
    .item-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .item-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
    .item-card-grid .full{grid-column:1/-1}
    .card-total{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
    .quote{display:none;background:#fff;color:#17243a;padding:30px;border-radius:12px}
    .quote h2{text-align:center;margin:0 0 8px;font-size:26px}
    .quote-meta{display:flex;justify-content:space-between;gap:16px;margin:22px 0;font-size:14px}
    .quote table{min-width:0}
    .quote th{background:#f2f5fa;color:#4b5870}
    .quote td,.quote th{padding:11px 9px}
    .quote-totals{width:min(330px,100%);margin:18px 0 0 auto}
    .quote-total-row{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
    .quote-total-row.grand{border-top:2px solid #25344d;margin-top:7px;padding-top:13px;font-size:19px;font-weight:800}
    .quote-note{margin-top:28px;padding-top:14px;border-top:1px solid #e5eaf1;color:#718096;font-size:12px}
    .bottom-bar{position:fixed;z-index:10;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:13px max(16px,env(safe-area-inset-right)) calc(13px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
    .bottom-inner{width:min(1080px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .bottom-hint{font-size:13px;color:var(--muted)}
    .bottom-actions{display:flex;gap:10px}
    .bottom-actions button{min-width:145px}
    footer{text-align:center;color:#97a2b4;font-size:12px;margin:20px 0}
    @media(max-width:700px){
      body{padding-bottom:120px}.wrap{width:calc(100% - 22px);margin:20px auto}
      header{align-items:flex-start;flex-direction:column;gap:9px;margin-bottom:18px}
      .panel{padding:17px;border-radius:15px}.customer-grid{grid-template-columns:1fr;gap:12px}
      .table-wrap{display:none}.mobile-items{display:block}
      .items-head{align-items:center}.items-head .panel-title{font-size:16px}
      .bottom-inner{display:block}.bottom-hint{display:none}.bottom-actions{display:grid;grid-template-columns:1fr 1.2fr;gap:9px}
      .bottom-actions button{min-width:0;padding:12px 8px;font-size:14px}
      .quote{padding:18px}.quote-meta{flex-direction:column;gap:5px}.quote td,.quote th{padding:8px 5px;font-size:12px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div><h1>商品報價單</h1><div class="sub">選擇商品、輸入數量，即可快速建立正式報價單。</div></div>
      <div class="status"><span id="statusDot" class="dot"></span><span id="statusText">正在連線商品資料…</span></div>
    </header>

    <div id="loading" class="loading">正在讀取 Google 試算表，請稍候…</div>
    <div id="error" class="error" role="alert"></div>

    <section class="panel">
      <h2 class="panel-title">客戶資料</h2>
      <div class="customer-grid">
        <div><label for="customerName">客戶名稱 *</label><input id="customerName" placeholder="請輸入客戶／公司名稱" autocomplete="organization"></div>
        <div><label for="quoteDate">報價日期</label><input id="quoteDate" type="date"></div>
      </div>
    </section>

    <section class="panel">
      <div class="items-head"><h2 class="panel-title">報價品項</h2><span class="muted" id="itemCount">0 個品項</span></div>
      <div class="table-wrap">
        <table>
          <thead><tr><th style="width:17%">類別</th><th style="width:16%">產品編號</th><th>品名</th><th style="width:9%">單位</th><th style="width:13%">單價</th><th style="width:12%">數量</th><th style="width:14%">小計</th><th></th></tr></thead>
          <tbody id="desktopRows"><tr><td colspan="8" class="empty">載入商品資料後即可新增品項</td></tr></tbody>
        </table>
      </div>
      <div id="mobileItems" class="mobile-items"><div class="empty">載入商品資料後即可新增品項</div></div>
      <div class="add-row"><button id="addBtn" class="btn btn-light" disabled>＋ 新增品項</button></div>
    </section>

    <section id="quoteSection" class="panel" style="display:none">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px">
        <h2 class="panel-title" style="margin:0">報價單預覽</h2><span class="muted">含 5% 營業稅</span>
      </div>
      <div id="quoteContent" class="quote" style="display:block"></div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap">
        <button id="downloadBtn" class="btn btn-primary" disabled>下載 PDF</button>
        <button id="shareBtn" class="btn btn-outline" disabled>分享 PDF</button>
      </div>
    </section>
    <footer>商品價格以 Google 試算表最新資料為準</footer>
  </main>

  <div class="bottom-bar">
    <div class="bottom-inner">
      <div class="bottom-hint" id="bottomHint">商品資料載入完成後即可開始建立報價單</div>
      <div class="bottom-actions">
        <button id="stickyAddBtn" class="btn btn-outline" disabled>＋ 新增品項</button>
        <button id="generateBtn" class="btn btn-primary" disabled>產生報價單</button>
      </div>
    </div>
  </div>

<script>
(() => {
  "use strict";
  const SHEET_ID = "1KxdBMBjqrrG7wEUGB7dls1QmbsarWkMttiSzXVT8nhE";
  const GID = "0";
  let products = [];
  let items = [];
  let ready = false;
  let latestQuote = null;
  const $ = id => document.getElementById(id);
  const money = n => "NT$ " + Number(n || 0).toLocaleString("zh-TW", {maximumFractionDigits:2});
  const today = new Date();
  const localDate = new Date(today.getTime() - today.getTimezoneOffset()*60000).toISOString().slice(0,10);
  $("quoteDate").value = localDate;

  function setStatus(text, state) {
    $("statusText").textContent = text;
    $("statusDot").className = "dot" + (state ? " " + state : "");
  }
  function fail(message) {
    ready = false;
    $("loading").style.display = "none";
    $("error").textContent = message;
    $("error").classList.add("show");
    setStatus("商品資料讀取失敗", "bad");
    ["addBtn","stickyAddBtn","generateBtn","downloadBtn","shareBtn"].forEach(id => $(id).disabled = true);
  }
  function loadSheet() {
    const callback = "handleQuoteSheetResponse";
    window[callback] = response => {
      clearTimeout(timer);
      try {
        if (!response || response.status !== "ok" || !response.table) {
          throw new Error(response?.errors?.[0]?.detailed_message || "Google 試算表沒有回傳有效資料。");
        }
        const cols = response.table.cols || [];
        const headers = cols.map(c => String(c.label || c.id || "").trim().toLowerCase());
        const required = ["type","pno","pname","unit","price"];
        const indexes = {};
        required.forEach(key => {
          indexes[key] = headers.indexOf(key);
          if (indexes[key] < 0) throw new Error("找不到必要欄位「" + key + "」，請確認第一列欄位名稱。");
        });
        products = (response.table.rows || []).map(row => {
          const cells = row.c || [];
          const get = key => {
            const cell = cells[indexes[key]];
            return cell && cell.v != null ? String(cell.f ?? cell.v).trim() : "";
          };
          return {type:get("type"), pno:get("pno"), pname:get("pname"), unit:get("unit"), price:Number(String(get("price")).replace(/,/g,""))};
        }).filter(p => p.type && p.pno && p.pname && Number.isFinite(p.price));
        if (!products.length) throw new Error("試算表目前沒有可使用的商品資料，請檢查資料列內容。");
        ready = true;
        $("loading").style.display = "none";
        $("error").classList.remove("show");
        setStatus("商品資料已更新，共 " + products.length + " 項", "ok");
        ["addBtn","stickyAddBtn","generateBtn"].forEach(id => $(id).disabled = false);
        $("bottomHint").textContent = "共 " + products.length + " 項商品可選擇";
        addItem();
      } catch (err) {
        fail("商品資料格式有誤：" + err.message);
      }
      delete window[callback];
    };
    const script = document.createElement("script");
    const url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=" +
      encodeURIComponent("out:json;responseHandler:" + callback) + "&gid=" + encodeURIComponent(GID) + "&headers=1";
    script.src = url;
    script.onerror = () => { clearTimeout(timer); fail("無法連線 Google 試算表。請確認網路正常，並確認試算表已設為「知道連結的任何人可檢視」，再重新整理頁面。"); };
    document.head.appendChild(script);
    const timer = setTimeout(() => fail("讀取商品資料逾時。請確認試算表分享權限為「知道連結的任何人可檢視」，再重新整理頁面。"), 15000);
  }

  function categories() { return [...new Set(products.map(p => p.type))]; }
  function productOptions(type) { return products.filter(p => p.type === type); }
  function escapeHtml(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function optionList(list, selected, placeholder) {
    return `<option value="">${placeholder}</option>` + list.map(v => `<option value="${escapeHtml(v)}" ${v===selected?"selected":""}>${escapeHtml(v)}</option>`).join("");
  }
  function addItem() {
    if (!ready) return;
    const firstCategory = categories()[0] || "";
    const firstProduct = productOptions(firstCategory)[0];
    items.push({id:crypto.randomUUID ? crypto.randomUUID() : String(Date.now()+Math.random()), type:firstCategory, pno:firstProduct?.pno || "", qty:1});
    renderItems();
  }
  function getProduct(item) {
    return products.find(p => p.type === item.type && p.pno === item.pno);
  }
  function updateItem(id, key, value) {
    const item = items.find(x => x.id === id);
    if (!item) return;
    item[key] = value;
    if (key === "type") item.pno = productOptions(value)[0]?.pno || "";
    if (key === "qty") {
      const qty = Math.max(0, Number(value) || 0);
      if (qty === 0) { items = items.filter(x => x.id !== id); renderItems(); return; }
      item.qty = qty;
    }
    renderItems();
  }
  function removeItem(id) { items = items.filter(x => x.id !== id); renderItems(); }
  function itemMarkup(item, mobile) {
    const p = getProduct(item);
    const categorySelect = `<select class="small-input" aria-label="商品類別" data-id="${item.id}" data-key="type">${optionList(categories(),item.type,"選擇類別")}</select>`;
    const productSelect = `<select class="small-input" aria-label="產品編號" data-id="${item.id}" data-key="pno">${optionList(productOptions(item.type).map(x=>x.pno),item.pno,"選擇編號")}</select>`;
    const qtyInput = `<input class="small-input" aria-label="數量，輸入 0 刪除" type="number" min="0" step="1" value="${escapeHtml(item.qty)}" data-id="${item.id}" data-key="qty">`;
    const name = p ? escapeHtml(p.pname) : '<span class="muted">請先選擇商品</span>';
    const unit = p ? escapeHtml(p.unit) : "—";
    const price = p ? money(p.price) : "—";
    const subtotal = p ? money(p.price * item.qty) : "—";
    if (!mobile) return `<tr>
      <td>${categorySelect}</td><td>${productSelect}</td><td class="product-name">${name}</td><td>${unit}</td>
      <td>${price}</td><td>${qtyInput}</td><td class="amount">${subtotal}</td>
      <td><button class="remove" data-remove="${item.id}" aria-label="刪除品項">×</button></td></tr>`;
    return `<article class="item-card">
      <div class="item-card-top"><strong>品項 ${items.findIndex(x=>x.id===item.id)+1}</strong><button class="remove" data-remove="${item.id}" aria-label="刪除品項">×</button></div>
      <div class="item-card-grid">
        <div><label>類別</label>${categorySelect}</div>
        <div><label>產品編號</label>${productSelect}</div>
        <div class="full"><label>品名</label><div class="product-name">${name}</div></div>
        <div><label>單位</label><div>${unit}</div></div><div><label>單價</label><div>${price}</div></div>
        <div><label>數量（填 0 刪除）</label>${qtyInput}</div><div><label>小計</label><div class="amount">${subtotal}</div></div>
      </div></article>`;
  }
  function renderItems() {
    $("itemCount").textContent = items.length + " 個品項";
    $("desktopRows").innerHTML = items.length ? items.map(i=>itemMarkup(i,false)).join("") : '<tr><td colspan="8" class="empty">尚未新增品項，請按「新增品項」</td></tr>';
    $("mobileItems").innerHTML = items.length ? items.map(i=>itemMarkup(i,true)).join("") : '<div class="empty">尚未新增品項，請按「新增品項」</div>';
    $("desktopRows").querySelectorAll("select,input").forEach(el => el.addEventListener("change", onItemChange));
    $("mobileItems").querySelectorAll("select,input").forEach(el => el.addEventListener("change", onItemChange));
    document.querySelectorAll("[data-remove]").forEach(el => el.addEventListener("click",()=>removeItem(el.dataset.remove)));
    $("generateBtn").disabled = !ready || !items.some(i=>getProduct(i));
    $("stickyAddBtn").disabled = $("addBtn").disabled = !ready;
    $("quoteSection").style.display = "none";
    latestQuote = null;
  }
  function onItemChange(event) {
    const el = event.currentTarget;
    updateItem(el.dataset.id,el.dataset.key,el.value);
  }

  function buildQuote() {
    if (!ready) return;
    const customer = $("customerName").value.trim();
    if (!customer) { alert("請先填寫客戶名稱。"); $("customerName").focus(); return; }
    const valid = items.map(i=>({item:i,product:getProduct(i)})).filter(x=>x.product && Number(x.item.qty)>0);
    if (!valid.length) { alert("請至少新增一個有效的報價品項。"); return; }
    const date = $("quoteDate").value || localDate;
    const subtotal = valid.reduce((sum,x)=>sum+x.product.price*Number(x.item.qty),0);
    const tax = Math.round(subtotal*0.05);
    const total = subtotal+tax;
    latestQuote = {customer,date,valid,subtotal,tax,total};
    const dateText = date.replaceAll("-","/");
    const rows = valid.map((x,index)=>`<tr>
      <td>${index+1}</td><td>${escapeHtml(x.product.pno)}</td><td>${escapeHtml(x.product.pname)}</td>
      <td>${escapeHtml(x.product.unit)}</td><td style="text-align:right">${money(x.product.price)}</td>
      <td style="text-align:right">${Number(x.item.qty).toLocaleString("zh-TW")}</td>
      <td style="text-align:right">${money(x.product.price*Number(x.item.qty))}</td></tr>`).join("");
    $("quoteContent").innerHTML = `
      <h2>報 價 單</h2><div style="text-align:center;color:#718096;font-size:12px">QUOTATION</div>
      <div class="quote-meta"><div><strong>客戶名稱：</strong>${escapeHtml(customer)}</div><div><strong>報價日期：</strong>${dateText}</div></div>
      <table><thead><tr><th>#</th><th>產品編號</th><th>品名</th><th>單位</th><th style="text-align:right">單價</th><th style="text-align:right">數量</th><th style="text-align:right">小計</th></tr></thead><tbody>${rows}</tbody></table>
      <div class="quote-totals">
        <div class="quote-total-row"><span>未稅小計</span><strong>${money(subtotal)}</strong></div>
        <div class="quote-total-row"><span>營業稅（5%）</span><strong>${money(tax)}</strong></div>
        <div class="quote-total-row grand"><span>含稅總計</span><span>${money(total)}</span></div>
      </div>
      <div class="quote-note">備註：本報價單金額以新台幣計價；營業稅依未稅小計計算 5%。</div>`;
    $("quoteSection").style.display = "block";
    $("downloadBtn").disabled = $("shareBtn").disabled = false;
    $("quoteSection").scrollIntoView({behavior:"smooth",block:"start"});
  }
  function fileName() {
    if (!latestQuote) return "報價單.pdf";
    const safe = latestQuote.customer.replace(/[\\/:*?"<>|]/g,"_").slice(0,40) || "客戶";
    return `報價單_${safe}_${latestQuote.date}.pdf`;
  }
  async function makePdfBlob() {
    if (!latestQuote) throw new Error("請先產生報價單");
    if (typeof html2pdf === "undefined") throw new Error("PDF 元件載入失敗，請確認網路連線後重新整理頁面。");
    const element = $("quoteContent");
    const opt = {
      margin:[10,10,10,10],
      filename:fileName(),
      image:{type:"jpeg",quality:0.98},
      html2canvas:{scale:2,useCORS:true,backgroundColor:"#ffffff",logging:false},
      jsPDF:{unit:"mm",format:"a4",orientation:"portrait"},
      pagebreak:{mode:["css","legacy"]}
    };
    const worker = html2pdf().set(opt).from(element).toPdf();
    const pdf = await worker.get("pdf");
    return pdf.output("blob");
  }
  async function downloadPdf() {
    const button = $("downloadBtn"); button.disabled = true; button.textContent = "製作中…";
    try {
      const blob = await makePdfBlob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href=url; a.download=fileName(); a.click();
      setTimeout(()=>URL.revokeObjectURL(url),1500);
    } catch(err) { alert(err.message || "PDF 產生失敗"); }
    finally { button.disabled=false; button.textContent="下載 PDF"; }
  }
  async function sharePdf() {
    const button = $("shareBtn"); button.disabled = true; button.textContent = "準備分享…";
    try {
      const blob = await makePdfBlob();
      const file = new File([blob],fileName(),{type:"application/pdf"});
      if (navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))) {
        await navigator.share({files:[file],title:"商品報價單",text:"報價單 PDF"});
      } else {
        const url=URL.createObjectURL(blob); const a=document.createElement("a");a.href=url;a.download=fileName();a.click();setTimeout(()=>URL.revokeObjectURL(url),1500);
        alert("此瀏覽器不支援直接分享檔案，已改為下載 PDF。下載後可從手機分享選單傳送至 LINE 或 Email。");
      }
    } catch(err) { if(err.name!=="AbortError") alert(err.message || "分享失敗"); }
    finally { button.disabled=false; button.textContent="分享 PDF"; }
  }

  $("addBtn").addEventListener("click",addItem);
  $("stickyAddBtn").addEventListener("click",addItem);
  $("generateBtn").addEventListener("click",buildQuote);
  $("downloadBtn").addEventListener("click",downloadPdf);
  $("shareBtn").addEventListener("click",sharePdf);
  loadSheet();
})();
</script>
